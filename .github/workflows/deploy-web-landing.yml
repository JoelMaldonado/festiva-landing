name: Deploy festiva-landing (Astro)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro (production)
        run: npm run build

      # (Opcional) Smoke check: confirma que dist/ existe y tiene index.html
      - name: Verify build output
        run: |
          ls -lah
          ls -lah dist
          test -f dist/index.html

      - name: Upload build files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          # Importante: en Astro queremos copiar el CONTENIDO de dist
          source: 'dist/*'
          target: '/var/www/festiva-landing'
          rm: true
          overwrite: true
          strip_components: 1

      - name: Run post-deploy commands
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "✅ Conectado al servidor vía SSH"
            ls -lah /var/www/festiva-landing
            sudo nginx -t
            sudo systemctl reload nginx